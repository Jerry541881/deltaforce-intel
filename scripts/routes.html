<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑刀路线 · 三角洲情报站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    color: #e6edf3; min-height: 100vh; padding: 40px 20px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 28px; margin-bottom: 6px; letter-spacing: 2px; }
  .sub { color: #7d8590; font-size: 14px; margin-bottom: 24px; line-height: 1.7; }
  .back { display:inline-block; margin-bottom:18px; color:#58a6ff; font-size:14px; text-decoration:none; }
  .back:hover { text-decoration:underline; }

  .toolbar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  #search {
    flex: 1 1 260px; background:#0d1117; border:1px solid #30363d; border-radius:8px;
    color:#e6edf3; padding:11px 14px; font-size:14px; outline:none;
  }
  #search:focus { border-color:#2ea043; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .tab {
    background:#21262d; border:1px solid #30363d; color:#7d8590; border-radius:20px;
    padding:7px 15px; font-size:13px; cursor:pointer; transition:.15s; user-select:none;
  }
  .tab:hover { color:#e6edf3; border-color:#58a6ff; }
  .tab.on { background:#2ea043; border-color:#2ea043; color:#fff; font-weight:bold; }

  .stat {
    background:#21262d; border-left:4px solid #58a6ff; padding:10px 16px; border-radius:6px;
    font-size:13px; color:#7d8590; margin-bottom:20px; display:flex; gap:18px; flex-wrap:wrap;
  }
  .stat b { color:#58a6ff; }

  .map {
    background:#161b22; border:1px solid #30363d; border-radius:10px;
    padding:18px 20px; margin-bottom:16px;
  }
  .map-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .map-name { font-size:19px; font-weight:bold; letter-spacing:1px; }
  .tag {
    font-size:11px; padding:3px 9px; border-radius:12px; background:#21262d;
    color:#7d8590; border:1px solid #30363d;
  }
  .tag.lv { color:#58a6ff; border-color:#1f6feb; }
  .tag.n { color:#2ea043; border-color:#2ea043; }
  .tag.low  { color:#2ea043; border-color:#2ea043; }
  .tag.mid  { color:#d29922; border-color:#d29922; }
  .tag.high { color:#f85149; border-color:#f85149; }

  .rt { border-top:1px dashed #21262d; padding:14px 0; }
  .rt:first-of-type { border-top:none; }
  .rt-name { font-size:15px; color:#c9d1d9; font-weight:bold; margin-bottom:8px; }
  .rt-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .pill {
    font-size:12px; background:#0d1117; border:1px solid #30363d; border-radius:6px;
    padding:4px 9px; color:#7d8590;
  }
  .pill b { color:#e6edf3; font-weight:normal; }
  .path {
    font-size:13px; color:#2ea043; line-height:1.9; background:#0d1117;
    border:1px solid #30363d; border-radius:6px; padding:10px 12px; margin-bottom:10px;
    word-break:break-all;
  }
  .kv { font-size:12.5px; color:#7d8590; line-height:1.95; }
  .kv b { color:#58a6ff; font-weight:normal; }
  .kv span.k { color:#484f58; display:inline-block; min-width:52px; }

  .state { text-align:center; padding:60px 20px; color:#7d8590; }
  .state.error { color:#f85149; }
  .spin {
    display:inline-block; width:20px; height:20px; border:2px solid #30363d;
    border-top-color:#2ea043; border-radius:50%; animation:r .8s linear infinite;
    vertical-align:middle; margin-right:8px;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  footer { margin-top:36px; text-align:center; color:#484f58; font-size:12px; line-height:1.9; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 返回首页</a>
  <h1>跑刀路线</h1>
  <div class="sub">
    《三角洲行动》烽火地带主流地图跑刀路线 · 按出生点给出搜刮链路、必摸点位与撤离方式<br>
    核心铁律：<b style="color:#2ea043">低战备、避全装、只摸高价值小件、听到枪声就绕、背包 6 成满就撤</b>
  </div>

  <div class="toolbar">
    <input id="search" type="text" placeholder="搜索地图 / 出生点 / 点位 / 干员，如 水泥厂、骇爪">
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="toolbar" style="margin-top:-4px">
    <div class="tabs" id="rtabs"></div>
  </div>

  <div class="stat" id="stat" style="display:none"></div>
  <div id="state" class="state"><span class="spin"></span>正在读取跑刀路线库…</div>
  <div id="list"></div>

  <footer>
    数据来源：18183 / 52pk / 游侠网 / 百度百科 / 今日头条 / 公众号攻略<br>
    物资刷新与战备物价随赛季调整，收益区间为参考值，请结合实际对局判断
  </footer>
</div>

<script>
const URL = 'https://oiwrcxuhanvpyxehgimr.supabase.co';
const KEY = 'sb_publishable_Rw3Awn_bOYKfgZJ6DTToVQ_Yk9SLfXp';

let ALL = [];
let curMap = '全部';
let curRisk = '全部';

function esc(s){
  return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function riskCls(r){
  if (r === '低') return 'low';
  if (r === '高') return 'high';
  return 'mid';
}

function render(){
  const kw = document.getElementById('search').value.trim().toLowerCase();
  const maps = {};

  ALL.forEach(r => {
    if (curMap !== '全部' && (r.map_name || '其他') !== curMap) return;
    if (curRisk !== '全部' && (r.risk || '中') !== curRisk) return;
    if (kw) {
      const hay = ((r.map_name||'') + ' ' + (r.name||'') + ' ' + (r.spawn||'') + ' '
                 + (r.path||'') + ' ' + (r.spots||'') + ' ' + (r.operator||'') + ' '
                 + (r.extract||'') + ' ' + (r.tips||'')).toLowerCase();
      if (hay.indexOf(kw) === -1) return;
    }
    const m = r.map_name || '未知';
    (maps[m] = maps[m] || []).push(r);
  });

  const names = Object.keys(maps);
  const total = names.reduce((s,n) => s + maps[n].length, 0);

  const st = document.getElementById('stat');
  st.style.display = 'flex';
  st.innerHTML = '<span>共 <b>' + names.length + '</b> 张地图</span>'
    + '<span><b>' + total + '</b> 条路线</span>'
    + '<span>当前：<b>' + esc(curMap) + ' · ' + esc(curRisk) + '风险</b></span>';

  const list = document.getElementById('list');
  if (!names.length) {
    list.innerHTML = '<div class="state">没有匹配的路线，换个关键词试试</div>';
    return;
  }

  list.innerHTML = names.map(m => {
    const rows = maps[m];
    const lv = rows[0].level || '进阶';
    return '<div class="map">'
      + '<div class="map-head">'
      +   '<span class="map-name">' + esc(m) + '</span>'
      +   '<span class="tag lv">' + esc(lv) + '</span>'
      +   '<span class="tag n">' + rows.length + ' 条路线</span>'
      + '</div>'
      + rows.map(r =>
          '<div class="rt">'
          + '<div class="rt-name">' + esc(r.name || '路线') + '</div>'
          + '<div class="rt-meta">'
          +   '<span class="tag ' + riskCls(r.risk) + '">风险 ' + esc(r.risk || '中') + '</span>'
          +   '<span class="pill">预估收益 <b>' + esc(r.est_value || '-') + '</b></span>'
          +   '<span class="pill">耗时 <b>' + esc(r.est_time || '-') + '</b></span>'
          + '</div>'
          + '<div class="path">' + esc(r.path || '') + '</div>'
          + '<div class="kv">'
          +   '<div><span class="k">出生点</span>' + esc(r.spawn || '-') + '</div>'
          +   '<div><span class="k">必搜点</span>' + esc(r.spots || '-') + '</div>'
          +   '<div><span class="k">撤离</span>' + esc(r.extract || '-') + '</div>'
          +   '<div><span class="k">干员</span>' + esc(r.operator || '-') + '</div>'
          +   '<div><span class="k">配装</span>' + esc(r.loadout || '-') + '</div>'
          +   '<div><span class="k">要点</span><b>' + esc(r.tips || '-') + '</b></div>'
          + '</div>'
          + '</div>'
        ).join('')
      + '</div>';
  }).join('');
}

function buildTabs(id, field, cur, cb){
  const arr = ['全部'];
  ALL.forEach(r => {
    const v = r[field] || '其他';
    if (arr.indexOf(v) === -1) arr.push(v);
  });
  const box = document.getElementById(id);
  box.innerHTML = arr.map(v =>
    '<span class="tab' + (v === cur ? ' on' : '') + '" data-t="' + esc(v) + '">' + esc(v) + '</span>'
  ).join('');
  box.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { cb(el.getAttribute('data-t')); };
  });
}

function refresh(){
  buildTabs('tabs', 'map_name', curMap, v => { curMap = v; refresh(); });
  buildTabs('rtabs', 'risk', curRisk, v => { curRisk = v; refresh(); });
  render();
}

(async function(){
  try {
    const res = await fetch(URL + '/rest/v1/routes?select=*&order=map_name.asc', {
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY },
      cache: 'no-store'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ALL = await res.json();
    if (!ALL.length) {
      document.getElementById('state').innerHTML = '暂无跑刀路线数据';
      return;
    }
    document.getElementById('state').style.display = 'none';
    refresh();
  } catch(e) {
    document.getElementById('state').className = 'state error';
    document.getElementById('state').textContent = '读取失败：' + e.message;
  }
})();

document.getElementById('search').addEventListener('input', render);
</script>
</body>
</html>
