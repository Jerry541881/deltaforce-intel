name: Daily Crawl

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        timeout-minutes: 3

      - name: Install deps
        run: pip install --no-cache-dir requests
        timeout-minutes: 3

      - name: Crawl builds
        run: python scripts/crawler_bilibili.py
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}