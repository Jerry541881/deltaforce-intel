# ============ HTTP 请求 ============
def fetch(url, extra_headers=None):
    h = {**HEADERS, **(extra_headers or {})}
    try:
        r = requests.get(url, headers=h, timeout=10)
        r.raise_for_status()
        return r.text
    except Exception as e:
        print(f"  ⚠️ 请求失败: {e}")
        return ""

def post_json(url, headers, data):
    try:
        r = requests.post(url, headers=headers, json=data, timeout=15)
        return r.status_code, r.json() if r.text else {}
    except Exception as e:
        return 0, {"error": str(e)}

# ============ 策略1: 智谱 Web Search ============
def zhipu_web_search(query):
    """调用智谱 Web Search API"""
    url = "https://open.bigmodel.cn/api/paas/v4/web_search"
    headers = {
        "Authorization": f"Bearer {ZHIPU_API_KEY}",
        "Content-Type": "application/json"
    }
    data = {
        "search_engine": "search_pro",
        "search_query": query,
        "search_intent": "on",
        "search_date_filter": "no_limit",
        "count": 15
    }
    code, resp = post_json(url, headers, data)
    if code != 200:
        print(f"  ⚠️ Web Search 返回 {code}: {str(resp)[:150]}")
        return []
    return resp.get("search_result", resp.get("data", []))

# ============ 策略2: 智谱 GLM 联网推理 ============
def zhipu_ai_query(prompt):
    """调用智谱 GLM-4-Flash 联网回答"""
    url = "https://open.bigmodel.cn/api/paas/v4/chat/completions"
    headers = {
        "Authorization": f"Bearer {ZHIPU_API_KEY}",
        "Content-Type": "application/json"
    }
    data = {
        "model": "glm-4-flash",
        "messages": [
            {"role": "system", "content": "你是一个信息检索助手。请联网搜索最新信息并直接给出准确答案，不要编造。"},
            {"role": "user", "content": prompt}
        ],
        "tools": [{"type": "web_search", "web_search": {"search_result": True}}],
        "temperature": 0.1
    }
    code, resp = post_json(url, headers, data)
    if code != 200:
        print(f"  ⚠️ GLM 返回 {code}: {str(resp)[:150]}")
        return ""
    try:
        return resp["choices"][0]["message"]["content"]
    except:
        return ""

# ============ 提取密码 ============
def extract_codes(text):
    """从文本里提取 6 张地图的 4 位密码"""
    results = {}
    if not text:
        return results

    for m in MAPS:
        # 多种格式: "零号大坝:9514" "零号大坝密码9514" "零号大坝 9514"
        patterns = [
            rf'{m}[密码]*[：:]\s*(\d{{4}})',
            rf'{m}\s*[是为]\s*(\d{{4}})',
            rf'{m}.{{0,10}}(\d{{4}})',
        ]
        for p in patterns:
            mm = re.search(p, text)
            if mm:
                results[m] = mm.group(1)
                break
    return results

def extract_from_search_results(results):
    """从搜索结果列表里逐个提取"""
    all_text = ""
    for item in results:
        if isinstance(item, dict):
            all_text += item.get("content", "") + "\n"
            all_text += item.get("snippet", "") + "\n"
            all_text += item.get("title", "") + "\n"
    return extract_codes(all_text)

# ============ 写 Supabase ============
def write_to_supabase(results, today_str):
    if not SUPABASE_URL or not SUPABASE_KEY:
        print("❌ Supabase 配置缺失")
        print(f"   请在 GitHub Settings → Secrets 配置")
        return False

    code_str = "|".join([f"{k}:{v}" for k, v in results.items()])

    url = f"{SUPABASE_URL}/rest/v1/daily_codes"
    headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": f"Bearer {SUPABASE_KEY}",
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates"
    }
    data = [{
        "code_date": today_str,
        "code_value": code_str,
        "verified": True,
        "source": "zhipu-ai"
    }]

    try:
        r = requests.post(url, headers=headers, json=data, timeout=10)
        if r.status_code in (200, 201, 204):
            print(f"✅ 写入 Supabase 成功")
            return True
        else:
            print(f"⚠️ Supabase 返回 {r.status_code}: {r.text[:200]}")
            return False
    except Exception as e:
        print(f"⚠️ 写库异常: {e}")
        return False

