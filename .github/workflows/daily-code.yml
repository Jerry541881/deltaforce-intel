name: Daily Code Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  update-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ✅ 写在 job 下面，不是全局

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        timeout-minutes: 3

      - name: Install deps
        run: |
          pip install --no-cache-dir requests beautifulsoup4
        timeout-minutes: 3

      - name: Crawl daily code
        run: python scripts/daily_code_crawler.py
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}