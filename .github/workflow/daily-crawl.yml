name: Daily Crawl (Weapon Builds)

on:
  schedule:
    - cron: '30 22 * * *'   # 北京时间 06:30
  workflow_dispatch:

jobs:
  crawl-weapon-builds:
    runs-on: ubuntu-latest
    # 不设 timeout-minutes，让它跑完所有58把枪
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --no-cache-dir requests

      - name: Run weapon build crawler (all 58 guns)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/crawler_bilibili.py
